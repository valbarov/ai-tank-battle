<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tank arena</title>
<style>
  body { background:#111; color:#ddd; font-family: Consolas, "Courier New", monospace; margin:0; padding:16px; }
  #wrap { display:flex; gap:20px; align-items:flex-start; }
  canvas { background:#000; image-rendering: pixelated; border:2px solid #333; }
  #side { width: 520px; }
  .p { border:1px solid #333; border-radius:4px; padding:8px 10px; margin-bottom:8px; }
  .p.thinking { box-shadow: 0 0 0 2px #fff inset; }
  .p.dead { opacity: .45; }
  .p h3 { margin:0 0 4px; font-size:15px; }
  .p .why { color:#bbb; font-size:13px; min-height: 2.4em; }
  .p .meta { font-size:12px; color:#888; }
  #status { font-size:16px; margin-bottom:10px; }
  #log { font-size:12px; color:#999; max-height: 260px; overflow:auto; border-top:1px solid #333; padding-top:6px; }
  #log div.hit { color:#ffb347; }
  #log div.kill { color:#ff5252; font-weight:bold; }
  .A { color:#4fc3f7 } .B { color:#ff7043 } .C { color:#9ccc65 } .D { color:#ffd54f }
</style>
</head>
<body>
<div id="status">loading...</div>
<div style="margin-bottom:8px"><button id="replay" style="background:#222;color:#ddd;border:1px solid #555;padding:3px 10px;font-family:inherit;cursor:pointer">replay last shot</button></div>
<div id="wrap">
  <canvas id="c" width="600" height="600"></canvas>
  <div id="side">
    <div id="players"></div>
    <div id="log"></div>
  </div>
</div>
<script>
const COLORS = {A:"#4fc3f7", B:"#ff7043", C:"#9ccc65", D:"#ffd54f"};
let CELL = 40, N = 15;
const SHOT_MS_PER_CELL = 70;      // shell speed
const TRACER_MS = 500;            // how long the shell track stays visible after impact
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let lastUpdated = 0, lastShotId = 0, queue = [], busy = false, shown = null, gameId = null;

function drawTank(x, y, face, color) {
  const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
  ctx.fillStyle = color;
  ctx.fillRect(x*CELL+8, y*CELL+8, CELL-16, CELL-16);
  ctx.fillStyle = "#000";
  ctx.fillRect(x*CELL+13, y*CELL+13, CELL-26, CELL-26);
  ctx.fillStyle = color;
  const d = {UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0]}[face] || [0,-1];
  ctx.fillRect(cx - 3 + d[0]*10, cy - 3 + d[1]*10, 6 + Math.abs(d[0])*10, 6 + Math.abs(d[1])*10);
}

function drawBoard(s) {
  ctx.clearRect(0,0,cv.width,cv.height);
  const g = s.grid;
  N = g.length; CELL = Math.floor(600 / N);
  for (let y=0; y<g.length; y++) for (let x=0; x<g[y].length; x++) {
    const ch = g[y][x];
    if (ch === "#") {
      ctx.fillStyle = "#8d4a2b"; ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
      ctx.strokeStyle="#5a2e1a"; ctx.strokeRect(x*CELL+4, y*CELL+4, CELL-8, CELL-8);
    } else if (ch === "@") {
      ctx.fillStyle = "#9e9e9e"; ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
      ctx.fillStyle = "#cfcfcf"; ctx.fillRect(x*CELL+6, y*CELL+6, CELL-12, CELL-12);
    } else if (ch === "~") {
      ctx.fillStyle = "#1e3a8a"; ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    }
    if (/[a-d]/.test(ch)) {
      const id = ch.toUpperCase();
      ctx.fillStyle = COLORS[id]; ctx.fillRect(x*CELL+4, y*CELL+4, CELL-8, CELL-8);
      ctx.fillStyle = "#000"; ctx.font = "bold 22px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("⚑", x*CELL+CELL/2, y*CELL+CELL/2+1);
    }
  }
  ctx.strokeStyle = "#222";
  for (let i=0;i<=N;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,N*CELL); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(N*CELL,i*CELL); ctx.stroke(); }
  for (const [id,p] of Object.entries(s.players)) {
    if (p.base && p.lives > 0) {
      drawTank(p.pos[0], p.pos[1], p.face, COLORS[id]);
      ctx.fillStyle = "#fff"; ctx.font = "bold 12px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(id, p.pos[0]*CELL+CELL/2, p.pos[1]*CELL+CELL/2);
    }
  }
}

function drawPanels(s) {
  const st = document.getElementById("status");
  st.innerHTML = s.over
    ? `GAME OVER after round ${s.round}. Winner: <span class="${s.winner}">${s.winner ? s.winner + " (" + s.players[s.winner].model + ")" : "nobody"}</span>. Ranking: ${s.ranking.map(i=>`<span class="${i}">${i}</span>`).join(" > ")}`
    : `Round ${s.round} / ${s.rounds} &nbsp; ${s.status || ""}${s.fog ? " &nbsp; fog " + s.fog : ""}`;
  const pl = document.getElementById("players");
  pl.innerHTML = Object.entries(s.players).map(([id,p]) => `
    <div class="p ${thinking(s,id)?"thinking":""} ${(!p.base||p.lives<=0)?"dead":""}" style="border-color:${COLORS[id]}">
      <h3><span class="${id}">${id}</span> ${p.model} &nbsp; ${"♥".repeat(Math.max(p.lives,0))}${"♡".repeat(Math.max(3-p.lives,0))} &nbsp; base ${p.base?"alive":"DESTROYED"} &nbsp; hits ${p.hits}</h3>
      <div class="meta">${thinking(s,id) ? "thinking..." : (p.action ? "last: " + p.action + (p.latency_s!=null ? " (" + p.latency_s + "s)" : p.source==="plan" ? " (from plan)" : "") : "waiting")}${p.plan && p.plan.length ? " &nbsp; plan: " + p.plan.join(" ") : ""}${p.invalid ? " &nbsp; invalid replies: " + p.invalid : ""}${p.calls ? " &nbsp; calls: " + p.calls : ""}</div>
      <div class="why">${p.why ? escapeHtml(p.why) : ""}</div>
    </div>`).join("");
  const lg = document.getElementById("log");
  lg.innerHTML = s.events.slice().reverse().map(e => {
    const cls = /DESTROYED|no lives left/.test(e.text) ? "kill" : /HIT/.test(e.text) ? "hit" : "";
    return `<div class="${cls}">r${e.round} <span class="${e.actor}">${e.actor}</span> ${escapeHtml(e.text)}</div>`;
  }).join("");
}
function thinking(s,id){ return [].concat(s.thinking||[]).includes(id); }
function escapeHtml(t){ return t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Fly a shell along its path over the board as it was before the shot (prev), then flash the impact.
async function animateShot(shot, prev) {
  const color = COLORS[shot.actor];
  const d = {UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0]}[shot.dir];
  const cells = [shot.from, ...shot.path];
  if (shot.hit === "edge") cells.push([shot.from[0] + d[0]*(shot.path.length+1), shot.from[1] + d[1]*(shot.path.length+1)]);
  const total = (cells.length - 1) * SHOT_MS_PER_CELL;
  const t0 = performance.now();
  while (true) {
    const t = Math.min(1, (performance.now() - t0) / Math.max(total, 1));
    const i = t * (cells.length - 1), k = Math.min(Math.floor(i), cells.length - 2), f = i - k;
    const x = (cells[k][0] + (cells[k+1][0]-cells[k][0])*f) * CELL + CELL/2;
    const y = (cells[k][1] + (cells[k+1][1]-cells[k][1])*f) * CELL + CELL/2;
    drawBoard(prev);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
    if (t >= 1) break;
    await sleep(16);
  }
  const tracer = () => {
    const a = cells[0], b = cells[cells.length-1];
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(a[0]*CELL+CELL/2, a[1]*CELL+CELL/2); ctx.lineTo(b[0]*CELL+CELL/2, b[1]*CELL+CELL/2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  };
  if (shot.at && shot.hit !== "edge") {
    const big = shot.hit === "tank" || shot.hit === "base";
    for (let r = 6; r <= (big ? 26 : 14); r += 4) {
      drawBoard(prev);
      ctx.fillStyle = shot.hit === "base" ? "#ff5252" : shot.hit === "tank" ? "#ffb347" : shot.hit === "steel" ? "#ddd" : "#c97a4a";
      ctx.beginPath(); ctx.arc(shot.at[0]*CELL+CELL/2, shot.at[1]*CELL+CELL/2, r, 0, Math.PI*2); ctx.fill();
      tracer();
      await sleep(big ? 45 : 30);
    }
  }
  drawBoard(prev); tracer();
  await sleep(TRACER_MS);
}
document.getElementById("replay").onclick = async () => {
  if (!shown || !(shown.shots||[]).length || busy) return;
  busy = true;
  await animateShot(shown.shots[shown.shots.length-1], shown);
  drawBoard(shown);
  busy = false;
  process();
};

async function process() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    const s = queue.shift();
    const fresh = (s.shots || []).filter(sh => sh.id > lastShotId);
    for (const sh of fresh) {
      await animateShot(sh, shown || s);
      lastShotId = sh.id;
    }
    drawBoard(s);
    drawPanels(s);
    shown = s;
  }
  busy = false;
}

async function poll() {
  try {
    const r = await fetch("state.json?" + Date.now());
    const s = await r.json();
    if (s.updated !== lastUpdated) {
      lastUpdated = s.updated;
      const maxId = Math.max(0, ...(s.shots || []).map(x => x.id));
      if (shown === null) lastShotId = maxId;  // do not replay history on page load
      else if ((s.game || null) !== gameId || maxId < lastShotId) lastShotId = 0;  // a new game restarted the shot counter
      gameId = s.game || null;
      queue.push(s);
      process();
    }
  } catch (e) { document.getElementById("status").textContent = "waiting for state.json ..."; }
  setTimeout(poll, 300);
}
poll();
</script>
</body>
</html>
